<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HealthAI - Sistema Inteligente de Hábitos Saludables</title>

<style>
body{
    font-family: Arial, sans-serif;
    background:#f0f4f8;
    margin:0;
    padding:20px;
}

.container{
    max-width:500px;
    margin:auto;
    background:white;
    padding:25px;
    border-radius:15px;
    box-shadow:0 0 15px rgba(0,0,0,.1);
}

h1{
    text-align:center;
}

input{
    width:100%;
    padding:10px;
    margin-top:5px;
    margin-bottom:15px;
    border-radius:8px;
    border:1px solid gray;
}

button{
    width:100%;
    padding:12px;
    background:#007BFF;
    color:white;
    border:none;
    border-radius:8px;
    cursor:pointer;
}

button:hover{
    background:#0056b3;
}

.resultado{
    margin-top:20px;
    padding:15px;
    background:#eef;
    border-radius:10px;
}
</style>

</head>

<body>

<div class="container">

<h1>HealthAI </h1>

<p>Ingresa tus hábitos diarios:</p>

<label>Horas de sueño:</label>
<input type="number" id="sueno">

<label>Litros de agua:</label>
<input type="number" id="agua">

<label>Minutos de ejercicio:</label>
<input type="number" id="ejercicio">

<label>Porciones saludables consumidas:</label>
<input type="number" id="alimentacion">

<button onclick="analizarHabitos()">
Analizar hábitos
</button>

<div class="resultado" id="resultado">

Esperando datos...

</div>

</div>

<script>

function analizarHabitos(){

let sueño =
parseFloat(document.getElementById("sueno").value);

let agua =
parseFloat(document.getElementById("agua").value);

let ejercicio =
parseFloat(document.getElementById("ejercicio").value);

let alimentacion =
parseFloat(document.getElementById("alimentacion").value);


let recomendaciones=[];

let puntaje=0;


/* Evaluación sueño */

if(sueño>=7){

puntaje+=25;

}else{

recomendaciones.push(
"Dormir mínimo 7-8 horas."
);

}


/* Evaluación agua */

if(agua>=2){

puntaje+=25;

}else{

recomendaciones.push(
"Aumentar consumo de agua."
);

}


/* Ejercicio */

if(ejercicio>=30){

puntaje+=25;

}else{

recomendaciones.push(
"Realizar mínimo 30 minutos de actividad física."
);

}


/* Alimentación */

if(alimentacion>=3){

puntaje+=25;

}else{

recomendaciones.push(
"Consumir más alimentos saludables."
);

}


let nivel="";

if(puntaje>=80){

nivel="Excelente";

}else if(puntaje>=50){

nivel="Intermedio";

}else{

nivel="Necesita mejorar";

}


document.getElementById(
"resultado"
).innerHTML=

`
<h3>Resultado</h3>

Puntaje saludable:
<b>${puntaje}/100</b>

<br><br>

Nivel:
<b>${nivel}</b>

<br><br>

Recomendaciones:

<ul>

${
recomendaciones.length>0
?
recomendaciones.map(
r=>`<li>${r}</li>`
).join("")
:
"<li>¡Buen trabajo! Mantén tus hábitos.</li>"
}

</ul>

`;

}

</script>

</body>
</html>
